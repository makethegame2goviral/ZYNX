<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070f">
  <title>ZYNX</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="loading" class="overlay"><div class="loading-card"><div class="zynx-logo">ZYNX</div><p>Initialisiere Roboterwelt …</p><div class="loader"></div></div></div>
    <header id="hud" class="hidden">
      <div class="hud-left">
        <div class="stat money"><span>⚡</span><b id="money-value">0</b></div>
        <div class="stat speed"><span>»</span><b id="speed-value">6.0</b></div>
        <div class="stat zone"><span>◉</span><b id="zone-value">Safe Zone</b></div>
      </div>
      <div class="hud-center"><div id="event-banner" class="hidden"></div></div>
      <div class="hud-right">
        <div class="stat player"><span>◉</span><b id="player-name">Spieler</b></div>
        <button id="inventory-button" class="icon-button">🎒</button>
        <button id="settings-button" class="icon-button">⚙️</button>
      </div>
    </header>
    <div id="interaction-hint" class="hidden"></div>
    <div id="touch-controls" class="hidden">
      <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
      <div class="touch-buttons"><button id="jump-button">SPRUNG</button><button id="interact-button">E</button></div>
    </div>
    <div id="inventory-panel" class="panel hidden"><div class="panel-header"><h2>Inventar</h2><button class="close-button" data-close="inventory-panel">✕</button></div><p class="panel-subtitle">10 Plätze · Eier sicher zur Basis bringen</p><div id="inventory-grid" class="inventory-grid"></div></div>
    <div id="settings-panel" class="panel hidden"><div class="panel-header"><h2>Einstellungen</h2><button class="close-button" data-close="settings-panel">✕</button></div><label class="setting-row"><span>Sound</span><input id="sound-toggle" type="checkbox" checked></label><div class="connection-status" id="connection-status">Verbinde …</div></div>
    <div id="toast-container"></div>
  </div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2"}}</script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
